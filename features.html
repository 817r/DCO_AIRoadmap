<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Features — DCO_AI Reforger</title>
    <meta name="description" content="Every DCO_AI Reforger feature with its release version, progress and description.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/site.css">
    <style>
        .filters { display: grid; grid-template-columns: 1fr 220px 180px; gap: 10px; margin-bottom: 12px; }
        @media (max-width: 760px) { .filters { grid-template-columns: 1fr; } }
        .field { width: 100%; background: var(--surface); border: 1px solid var(--border-strong); color: var(--text); font: 14px var(--sans); padding: 10px 12px; }
        .field:focus { outline: none; border-color: var(--yellow); }
        .result-count { font-family: var(--mono); font-size: 12px; color: var(--text-dim); margin-bottom: 12px; }

        .rows { border-top: 1px solid var(--border); }
        .row { border-bottom: 1px solid var(--border); }
        .row summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1fr 170px 110px 150px 16px; gap: 16px; align-items: center; padding: 14px 8px; }
        .row summary::-webkit-details-marker { display: none; }
        .row summary > .tag, .row summary > .chip { justify-self: start; }
        .row summary:hover { background: var(--surface); }
        .row[open] summary { background: var(--surface); }
        .row-name { font-weight: 600; color: var(--white); }
        .row-prog { display: grid; grid-template-columns: 1fr 40px; gap: 10px; align-items: center; }
        .row-prog b { font-family: var(--mono); font-size: 12px; text-align: right; }
        .chev { width: 8px; height: 8px; border-right: 2px solid var(--text-dim); border-bottom: 2px solid var(--text-dim); transform: rotate(-45deg); transition: transform 0.2s; }
        .row[open] .chev { transform: rotate(45deg); border-color: var(--yellow); }
        @media (max-width: 760px) {
            .row summary { grid-template-columns: 1fr auto 16px; row-gap: 8px; }
            .row summary .tag { grid-column: 1; grid-row: 2; justify-self: start; }
            .row summary .row-prog { grid-column: 1 / -1; grid-row: 3; }
        }
        .row-body { padding: 4px 8px 20px; background: var(--surface); display: grid; grid-template-columns: 1fr 360px; gap: 24px; }
        .row-body.no-media { grid-template-columns: 1fr; }
        @media (max-width: 900px) { .row-body { grid-template-columns: 1fr; } }
        .row-body p { color: var(--text); font-size: 14px; max-width: 720px; }
        .meta { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-family: var(--mono); font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
        .meta b { color: var(--text-mid); font-weight: 700; }
        .row-body video { width: 100%; aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--border); }
        .empty { padding: 48px 0; text-align: center; color: var(--text-dim); }
    </style>
</head>
<body>
<main id="main">

    <header class="page-head">
        <div class="container">
            <div class="kicker">// Feature database</div>
            <h1>Every feature, tracked</h1>
            <p class="lead">Everything in the DCO_AI codebase, grouped by system, with the Workshop version it shipped in and how far along it is.</p>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <div class="stats mb-24" id="summary"></div>

            <div class="filters">
                <label class="sr-only" for="q">Search features</label>
                <input class="field" id="q" type="search" placeholder="Search features…">
                <label class="sr-only" for="cat">Category</label>
                <select class="field" id="cat"><option value="">All categories</option></select>
                <label class="sr-only" for="rel">Release</label>
                <select class="field" id="rel">
                    <option value="">Any release</option>
                    <option value="live">Live on Workshop</option>
                    <option value="dev">In dev build</option>
                    <option value="planned">Planned</option>
                </select>
            </div>
            <div class="result-count" id="count"></div>
            <div class="rows" id="rows"></div>
        </div>
    </section>

</main>
<script src="assets/site.js"></script>
<script>
    DCO.ready.then(async () => {
        const [features, milestones] = await Promise.all([DCO.load('features'), DCO.load('roadmap')]);
        const colorOf = Object.fromEntries(milestones.map(m => [m.cat, m.color]));
        const order = milestones.map(m => m.cat);
        features.sort((a, b) => order.indexOf(a.cat) - order.indexOf(b.cat) || b.prio - a.prio);

        const byStatus = key => features.filter(f => DCO.status(f.prog).key === key).length;
        document.getElementById('summary').innerHTML = `
            <div class="stat"><div class="stat-val">${features.length}</div><div class="stat-label">Features</div></div>
            <div class="stat"><div class="stat-val" style="color:var(--green)">${byStatus('complete')}</div><div class="stat-label">Complete</div></div>
            <div class="stat"><div class="stat-val" style="color:var(--yellow)">${byStatus('progress') + byStatus('early')}</div><div class="stat-label">In development</div></div>
            <div class="stat"><div class="stat-val" style="color:var(--red)">${byStatus('planned')}</div><div class="stat-label">Planned</div></div>`;

        const cat = document.getElementById('cat');
        order.forEach(c => cat.insertAdjacentHTML('beforeend',
            `<option value="${DCO.esc(c)}">${DCO.esc(c)} (${features.filter(f => f.cat === c).length})</option>`));
        const params = new URLSearchParams(location.search);
        if (params.get('cat')) cat.value = params.get('cat');

        const q = document.getElementById('q');
        const rel = document.getElementById('rel');

        function media(f) {
            if (!f.video) return '';
            const yt = f.video.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);
            return yt
                ? `<div class="yt" data-yt="${yt[1]}" data-title="${DCO.esc(f.name)}"></div>`
                : `<video controls preload="none" src="${encodeURI(f.video)}"></video>`;
        }

        function render() {
            const term = q.value.trim().toLowerCase();
            const list = features.filter(f =>
                (!cat.value || f.cat === cat.value) &&
                (!rel.value || DCO.release(f.ver).key === rel.value) &&
                (!term || (f.name + ' ' + f.desc).toLowerCase().includes(term)));

            document.getElementById('count').textContent = `Showing ${list.length} of ${features.length}`;
            document.getElementById('rows').innerHTML = list.length ? list.map(f => {
                const st = DCO.status(f.prog);
                const m = media(f);
                return `
                <details class="row">
                    <summary>
                        <span class="row-name">${DCO.esc(f.name)}</span>
                        <span class="tag c-${colorOf[f.cat] || 'yellow'}">${DCO.esc(f.cat)}</span>
                        ${DCO.release(f.ver).html}
                        <span class="row-prog"><span class="bar" style="--c:${st.color}"><span style="width:${f.prog}%"></span></span><b style="color:${st.color}">${f.prog}%</b></span>
                        <span class="chev" aria-hidden="true"></span>
                    </summary>
                    <div class="row-body${m ? '' : ' no-media'}">
                        <div>
                            <p>${DCO.esc(f.desc)}</p>
                            <div class="meta"><span>Status <b style="color:${st.color}">${st.label}</b></span><span>Progress <b>${f.prog}%</b></span><span>Priority <b>${f.prio}</b></span></div>
                        </div>
                        ${m}
                    </div>
                </details>`;
            }).join('') : '<div class="empty">No features match these filters.</div>';
            DCO.initVideos(document.getElementById('rows'));
        }

        [q, cat, rel].forEach(el => el.addEventListener('input', render));
        render();
    });
</script>
</body>
</html>
