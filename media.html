<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media — DCO_AI Reforger</title>
    <meta name="description" content="DCO_AI Reforger gameplay videos and test footage.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/site.css">
    <style>
        .featured { margin-bottom: 20px; }
        .clip { background: var(--surface); border: 1px solid var(--border); }
        .clip .yt, .clip video { border: 0; border-bottom: 1px solid var(--border); }
        .clip video { width: 100%; aspect-ratio: 16 / 9; background: #000; }
        .clip-body { padding: 14px 16px; }
        .clip-body b { color: var(--white); display: block; font-weight: 600; }
        .clip-body span { font-size: 13px; color: var(--text-mid); }
    </style>
</head>
<body>
<main id="main">

    <header class="page-head">
        <div class="container">
            <div class="kicker">// Media</div>
            <h1>See it in action</h1>
            <p class="lead">Test operations and gameplay footage of DCO_AI in Arma Reforger.</p>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <div id="featured" class="featured"></div>
            <div class="grid grid-3" id="videos">
                <div class="clip">
                    <video controls preload="none" src="video/Arma%20Reforger%20DCO%20AI%20-%20Failing%20hard%20against%20our%20AI.mp4"></video>
                    <div class="clip-body"><b>Failing hard against our AI</b><span>Raw test footage</span></div>
                </div>
            </div>

            <div class="callout mt-32">
                <div>
                    <h2>Made a video with DCO_AI?</h2>
                    <p>Share it with the team and the community on Discord.</p>
                </div>
                <div class="btn-row">
                    <a class="btn btn-discord" data-link="discord" href="#">Share on Discord</a>
                    <a class="btn" data-link="workshop" href="#">Get the mod</a>
                </div>
            </div>
        </div>
    </section>

</main>
<script src="assets/site.js"></script>
<script>
    DCO.ready.then(site => {
        const [first, ...rest] = site.videos;
        document.getElementById('featured').innerHTML =
            `<div class="yt" data-yt="${DCO.esc(first.id)}" data-title="${DCO.esc(first.title)}"></div>`;
        document.getElementById('videos').insertAdjacentHTML('afterbegin', rest.map(v => `
            <div class="clip">
                <div class="yt" data-yt="${DCO.esc(v.id)}"></div>
                <div class="clip-body"><b>${DCO.esc(v.title)}</b><span>YouTube</span></div>
            </div>`).join(''));
        DCO.initVideos();
    });
</script>
</body>
</html>
